plugins {
    id 'com.android.application'
}

android {
    namespace 'cz.nexora.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'cz.nexora.tv'
        minSdk 23
        targetSdk 28
        versionCode 6
        versionName '3.5.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}