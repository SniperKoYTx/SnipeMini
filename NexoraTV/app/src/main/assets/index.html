:root{--accent:#a695ff;--bg1:#090c27;--bg2:#33235f;--bg3:#181b46;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080c1c;color:white;font:16px/1.45 'Segoe UI',Arial,sans-serif;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer;color:inherit}#world{position:fixed;inset:0;background:linear-gradient(145deg,var(--bg1),var(--bg2) 62%,var(--bg3));transition:background 1.5s;overflow:hidden}#world:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 85% 24%,#9b69ff3d,transparent 45%),linear-gradient(0deg,#030713c9,transparent 80%)}#stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,white 90%,transparent),radial-gradient(2px 2px at 72% 13%,white 90%,transparent),radial-gradient(1px 1px at 47% 17%,white 90%,transparent);background-size:220px 160px;opacity:.6}#snow{position:absolute;inset:0;pointer-events:none}.flake{position:absolute;top:-25px;animation:fall linear infinite;color:#fff9;will-change:transform}@keyframes fall{to{transform:translate3d(35px,110vh,0)}}#freddy{position:absolute;right:1%;bottom:-8%;width:min(31vw,430px);max-height:80vh;object-fit:contain;filter:drop-shadow(0 0 35px #8e78ff65);animation:float 6s ease-in-out infinite;pointer-events:none;opacity:.84}@keyframes float{50%{transform:translateY(-12px) rotate(1deg)}}#shell{position:relative;z-index:2;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(90deg,#070b22b8,transparent 95%);padding:28px clamp(26px,4vw,70px)}header{display:flex;align-items:center;gap:32px;flex:none}.logo{font-weight:850;font-size:23px;letter-spacing:.15em;white-space:nowrap}.logo span{color:var(--accent)}nav{display:flex;gap:8px;flex-wrap:wrap}.navbtn{background:transparent;border:1px solid transparent;border-radius:28px;padding:10px 17px;color:#d8dbed}.navbtn.active{background:#ffffff1d;border-color:#ffffff44;color:#fff}.clock{margin-left:auto;text-align:right;white-space:nowrap;font-size:24px;font-weight:700} r));gap:15px;max-width:1060px}.grid .appcard{width:100%;height:135px}.quick{padding:19px;background:#ffffff12;min-width:190px;min-height:85px}.quick b{display:block}.quick small{color:#c9cee3}.setting-card{padding:18px;background:#ffffff12;min-width:190px}.setting-card select{width:100%;margin-top:9px;padding:9px;background:#141b37;border:1px solid #ffffff50;border-radius:8px}.hint{font-size:12px;color:#bec5e0;margin-top:24px}.panel{max-width:780px;padding:16px 20px;background:#080e29a6;border:1px solid #ffffff25;border-radius:18px;margin-top:15px}.actions{display:flex;gap:10px;flex-wrap:wrap}.action{padding:10px 17px;border:1px solid #ffffff55;background:#ffffff22;border-radius:10px}.action.primary{background:#6653c8}.action:disabled{opacity:.5}#toast{position:fixed;z-index:20;bottom:22px;left:50%;transform:translateX(-50%);background:#101832ee;border:1px solid #ffffff55;border-radius:14px;padding:12px 20px;display:none;max-width:80vw;text-align:center}#toast.show{display:block}@media(max-width:850px){#shell{padding:18px}header{gap:12px;flex-wrap:wrap}.logo{font-size:17px}nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}.navbtn{padding:7px 11px}.clock{font-size:17px}#freddy{width:40vw;opacity:.48}.hero{min-height:160px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
