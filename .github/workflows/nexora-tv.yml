name: Build Nexora TV APK
on:
  push:
    branches: [nexora-tv-build]
    paths:
      - "NexoraTV/**"
      - ".github/workflows/nexora-tv.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android TV
        run: gradle --no-daemon :app:assembleDebug
        working-directory: NexoraTV
      - uses: actions/upload-artifact@v4
        with:
          name: NexoraTV-PS5-Winter-APK
          path: NexoraTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30