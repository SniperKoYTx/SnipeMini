name: Build Nexora TV APK
on:
  push:
    branches: [nexora-tv-build]
    paths:
      - "NexoraTV/**"
      - ".github/workflows/nexora-tv.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Nexora project
        run: |
          mkdir -p NexoraTV
          base64 -d NexoraTV/NEXORA_CODE.xz.b64 | tar -xJ -C NexoraTV
          test -f NexoraTV/app/src/main/java/cz/nexora/tv/MainActivity.java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: NexoraTV
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexoraTV-APK
          path: NexoraTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
