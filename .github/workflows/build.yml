name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot 4.4.1 and Android templates
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Configure Android export
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          mkdir -p "$HOME/.android" "$HOME/.config/godot" "$HOME/.local/share/godot/keystores"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp "$HOME/.android/debug.keystore" "$HOME/.local/share/godot/keystores/debug.keystore"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Validate Godot project
        run: godot --headless --verbose --path godot --editor --quit
      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p godot/build
          echo "Godot editor settings:"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          test -f "$HOME/.local/share/godot/keystores/debug.keystore"
          test -f "$HOME/.android/debug.keystore"
          echo "Installed Android SDK packages:"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed
          echo "Installed Godot Android export template:"
          ls -lh "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          echo "Debug keystore:"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android
          godot --headless --verbose --path godot --export-debug "Android" build/UNBURIED-debug.apk
          test -s godot/build/UNBURIED-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UNBURIED-3D-APK
          path: godot/build/UNBURIED-debug.apk
